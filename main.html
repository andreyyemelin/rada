<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRS RADA - פורטל עובדים</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      background-image: 
        radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.12) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(56, 189, 248, 0.08) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #f8fafc;
    }

    header {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      height: 40px;
      object-fit: contain;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }

    .user-greeting {
      font-size: 13.5px;
      font-weight: 500;
      color: #e2e8f0;
    }

    .logout-btn {
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 7px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.4);
      color: #ffffff;
    }

    main {
      flex: 1;
      padding: 48px 24px;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    .page-title {
      margin-bottom: 32px;
      text-align: right;
    }

    .page-title h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .page-title p {
      color: #94a3b8;
      font-size: 14.5px;
      margin-top: 4px;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .app-card {
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .app-card:hover {
      transform: translateY(-4px);
      background: rgba(30, 41, 59, 0.7);
      border-color: rgba(56, 189, 248, 0.3);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .icon-wrapper {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s ease;
    }

    .app-card:hover .icon-wrapper {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.2);
    }

    .app-icon {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .placeholder-icon {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
    }

    .app-title {
      font-size: 14.5px;
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.4;
    }

    .loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      color: white;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #38bdf8;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 16px;
      font-weight: 500;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <img src="radalogo.png" alt="DRS RADA" class="header-logo" onerror="this.style.display='none'">
    
    <div class="user-area">
      <div class="user-badge">
        <div class="user-avatar">א</div>
        <div id="greeting" class="user-greeting">...</div>
      </div>
      <button class="logout-btn" id="logoutBtn">יציאה</button>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>אפליקציות ומערכות</h1>
      <p>בחר אפליקציה למעבר מהיר</p>
    </div>

    <div class="apps-grid" id="appsGrid"></div>
  </main>

  <div id="loaderOverlay" class="loader-overlay">
    <div class="spinner"></div>
    <div class="loader-text">מתחבר למערכת, אנא המתן...</div>
  </div>

  <script>
    const userCode = localStorage.getItem("userCode");
    if (userCode !== "606598") {
      window.location.href = "index.html";
    } else {
      document.getElementById("greeting").innerText = "שלום אנדריי יאמלין,";
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("userCode");
      window.location.href = "index.html";
    });

    const apps = [
      { name: "PLM", logo: "plmlogo.png", url: "https://drs-tcprodapp.rada.com:3000/" },
      { name: "DRS RADA - IT Service Desk", logo: "ithelplogo.png", url: "https://rada.freshservice.com/support/home" },
      { name: "Priority web", logo: "prioritylogo.png", url: "https://erpweb.it-rti.com/" },
      { name: "אתר דיווח שעות", logo: null, url: "https://timework.manpowergroup.co.il/timenet/Tb.aspx" },
      { name: "אתר חישוב שעות", logo: null, url: "http://andreyyemelin.github.io/rada-sahar" },
      { name: "קבצים", logo: null, url: "files.html" }
    ];

    const grid = document.getElementById("appsGrid");

    apps.forEach(app => {
      const card = document.createElement("div");
      card.className = "app-card";

      let iconHtml = app.logo 
        ? `<img src="${app.logo}" alt="${app.name}" class="app-icon" onerror="this.parentElement.innerHTML='<div class=\\'placeholder-icon\\'>?</div>'">`
        : `<div class="placeholder-icon">?</div>`;

      card.innerHTML = `
        <div class="icon-wrapper">
          ${iconHtml}
        </div>
        <div class="app-title">${app.name}</div>
      `;

      card.addEventListener("click", () => {
        openAppWithDelay(app.url, app.name);
      });

      grid.appendChild(card);
    });

    function openAppWithDelay(targetUrl, appName) {
      const loader = document.getElementById("loaderOverlay");
      loader.style.display = "flex";

      // אם זו לשונית "קבצים", ההמתנה היא בדיוק 1,000 מילישניות (שנייה אחת).
      // לכל שאר הלשוניות: זמן אקראי בין 1 ל-10 שניות.
      const delay = (appName === "קבצים") 
        ? 1000 
        : Math.floor(Math.random() * 9000) + 1000;

      setTimeout(() => {
        window.location.href = targetUrl;
      }, delay);
    }
  </script>

</body>
</html>
