<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRS RADA Technologies - כניסה למערכת</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #090d16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #f8fafc;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 40px 32px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .logo-container {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 60px;
    }

    .logo {
      max-width: 200px;
      max-height: 70px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      margin: 20px 0 28px 0;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      text-align: right;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 13.5px;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      font-size: 16px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background-color: rgba(255, 255, 255, 0.04);
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
      background-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.35);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(37, 99, 235, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    .error-msg {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px;
      border-radius: 12px;
      margin-top: 18px;
      font-size: 13.5px;
      font-weight: 500;
      display: none;
    }

    .support-footer {
      margin-top: 24px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    .support-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .support-footer a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-container">
        <img src="radalogo.png" alt="DRS RADA Technologies" class="logo" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='block';">
        <h3 id="alt-logo" style="display:none; color:#ffffff; font-weight:800; font-size:22px;">DRS RADA</h3>
      </div>

      <div class="divider"></div>

      <h2>אזור אישי</h2>
      <p class="subtitle">הזן קוד עובד כדי להתחבר למערכת</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="empCode">מספר עובד</label>
          <input type="text" id="empCode" placeholder="הכנס קוד עובד" required autocomplete="off">
        </div>
        <button type="submit">התחבר למערכת</button>
        <div id="errorMsg" class="error-msg">מס' עובד שגוי, אנא נסה שנית</div>
      </form>
    </div>

    <div class="support-footer">
      לפתיחת משתמש או תמיכה, יש לפנות למייל הבא ולציין מספר עובד:<br>
      <a href="mailto:radaapp@yemelin.org">radaapp@yemelin.org</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const codeInput = document.getElementById('empCode').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      if (codeInput === "606598") {
        localStorage.setItem("userCode", codeInput);
        window.location.href = "main.html";
      } else {
        errorMsg.style.display = "block";
      }
    });
  </script>

</body>
</html>
